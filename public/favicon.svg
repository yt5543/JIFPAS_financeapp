<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#f1f5f9" rx="20"/>

  <!-- Eye outline (represents "seeing/visibility") -->
  <ellipse cx="50" cy="45" rx="28" ry="20" fill="none" stroke="#0f766e" stroke-width="3"/>

  <!-- Eye pupil -->
  <circle cx="50" cy="45" r="10" fill="#0f766e"/>

  <!-- Upward trend arrow (financial growth) -->
  <path d="M 35 70 L 50 55 L 65 70" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trend line -->
  <line x1="35" y1="70" x2="65" y2="70" stroke="#14b8a6" stroke-width="2"/>
</svg>